services:
  # GLUETUN - The VPN Tunnel
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8080:8080 # qBittorrent WebUI
      - 6881:6881 # Torrent Port
      - 6881:6881/udp
      - 9696:9696 # Prowlarr
      - 8191:8191 # FlareSolverr
    volumes:
      - gluetun-config:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_REGIONS=Netherlands
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=private internet access
      - UPDATER_PERIOD=24h
    healthcheck:
      test: ping -c 1 www.google.com || exit 1
      interval: 20s
      timeout: 10s
      retries: 5
    restart: always

  # QBITTORRENT - Routed through VPN
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Vilnius
      - WEBUI_PORT=8080
    volumes:
      - qbit-config:/config
      - /mnt/ssd_downloads:/downloads
    network_mode: "service:gluetun"
    restart: always
    depends_on:
      gluetun:
        condition: service_healthy

  # FLARESOLVERR
  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Vilnius
      - CAPTCHA_SOLVER=none
    network_mode: "service:gluetun"
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy

  # PROWLARR
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Vilnius
    volumes:
      - prowlarr-config:/config
    network_mode: "service:gluetun"
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy

  # RADARR
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Vilnius
    volumes:
      - radarr-config:/config
      - /mnt/media/movies:/movies
      - /mnt/ssd_downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped

  # SONARR
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Vilnius
    volumes:
      - sonarr-config:/config
      - /mnt/media/tv_shows:/tv
      - /mnt/ssd_downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

  # SEERR - Replaces Jellyseerr
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true            # Required for Seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/Vilnius
    ports:
      - 5055:5055
    volumes:
      - /root/jellyseerr-config:/app/config
    restart: unless-stopped

  # BAZARR - Subtitles manager
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Vilnius
    volumes:
      - bazarr-config:/config
      - /mnt/media/movies:/movies
      - /mnt/media/tv_shows:/tv
    ports:
      - 6767:6767
    restart: unless-stopped

volumes:
  prowlarr-config:
  radarr-config:
  sonarr-config:
  qbit-config:
  bazarr-config:
  gluetun-config:
