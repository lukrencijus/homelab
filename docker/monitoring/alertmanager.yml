route:
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: "discord-notifications"

receivers:
  - name: "discord-notifications"
    discord_configs:
      # Real webhook URL lives only on the server, not in git.
      - webhook_url: "https://discord.com/api/webhooks/CHANGE_ME"
        send_resolved: true
