# Raise the free-memory watermark so allocations on this KVM host do not fall
# into *direct compaction*.
#
# Failure mode this prevents: the TrueNAS VM's vhost-net thread enters direct
# compaction, tries to migrate a folio backed by dirty NFS data, and blocks in
# folio_wait_writeback() waiting on TrueNAS, whose network is served by that
# very vhost thread. The guest stays healthy; only its virtual NIC goes dead.
#
# The default (~64 MB) is far too low for 24 GB with a 10 GB VM pinned.
# 512 MB keeps kswapd/kcompactd ahead of demand so allocators get pages from
# the free lists instead of compacting synchronously in a latency-critical
# thread. Costs 512 MB of never-allocated headroom.
vm.min_free_kbytes = 524288
