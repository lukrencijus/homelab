dir: local
	path /var/lib/vz
	content import,backup,vztmpl,iso

lvmthin: local-lvm
	thinpool data
	vgname pve
	content rootdir,images

nfs: backup-truenas
	export /mnt/HDD2000/backups
	path /mnt/pve/backup-truenas
	server 192.168.8.5
	content backup
	options vers=4.2,soft,timeo=600,retrans=5
	prune-backups keep-last=4
